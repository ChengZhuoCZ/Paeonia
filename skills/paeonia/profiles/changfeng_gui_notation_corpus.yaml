    observed_patterns:
      - main_unknown_u_and_parameter_alpha
      - sphere_mathbb_S2
      - great_circles_hemispheres_reflections_named_by_semantic_geometry_symbols
      - set_and_vector_field_notation_introduced_at_first_need
      - theorem_hierarchy_uses_existing_object_symbols
promoted_traits:
  high_confidence:
    - ordinary_letters_for_primary_objects
    - standard_field_symbols_for_operators_spaces_and_parameters
    - semantic_initials_for_concrete_geometry_when_natural
    - base_symbol_plus_subscript_or_modifier_for_related_families
    - generic_to_specific_geometry_notation
    - compact_local_notation_introduced_near_first_use
    - coordinate_reduction_may_rename_to_simple_x
  moderate_confidence:
    - u_as_default_scalar_unknown
    - mu_for_Neumann_and_lambda_for_Dirichlet_or_mixed_spectral_quantities
    - P_i_for_vertices
    - T_Q_K_for_triangle_quadrangle_kite
  not_promoted:
    - exact_symbol_sequences_from_any_single_paper
    - blanket_claim_that_calligraphic_or_fraktur_notation_is_absent
    - attribution_of_coauthored_symbol_choices_to_one_author
user_override_layer:
  plain_typography_preference: true
  avoid_mathscr: true
  avoid_mathfrak: true
  restrain_mathcal: true
  note: >-
    This is the user's house style. It is intentionally stronger than the corpus evidence,
    which includes examples such as mathfrak L and mathcal J_alpha as well as mathcal Z(u)
    and mathcal C_nv(u).
