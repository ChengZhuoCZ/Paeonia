version: 1
profile: changfeng_gui_corpus_soft_prior
purpose: empirical_notation_evidence
attribution_caveat: >-
  All papers are coauthored unless noted otherwise. Exact symbol choices are therefore
  corpus evidence, not claims of individual authorship. Only repeated abstract habits
  may be promoted to the runtime notation prior.
priority_rule:
  - duplicate_symbol_integrity
  - explicit_user_requirements
  - field_and_problem_conventions
  - clear_collision_free_source_notation
  - changfeng_gui_corpus_prior
papers:
  - arxiv: '1605.06481'
