      confidence: strong
    opening_policy:
      value: mathematics_attached_openings_preferred_over_administrative_meta_openings
      confidence: strong
    display_adjacency:
      value: display_boundaries_follow_obligation_change_not_typography_alone
      confidence: strong
    qualitative_transition_graph:
      value:
        - routine_to_routine_runs_are_normal
        - routine_and_delicate_alternate_at_legality_pressure
        - structural_returns_to_routine_execution
        - bridge_returns_to_mainline_routine_motion
        - routine_often_closes_claim
      confidence: moderate
    numerical_fit_policy:
      value: descriptive_evidence_only_never_generation_target
      confidence: strong
    exact_source_role_sequence_reuse: forbidden

  section_narrative_fingerprint:
